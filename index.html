<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TENET — AI Control Layer</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#10151c; --panel2:#0d1219; --line:#1e2733; --line2:#161d27;
    --ink:#e6edf3; --mut:#7d8b9c; --dim:#56616f;
    --acc:#f0883e; --ok:#3fb950; --deny:#f85149; --hum:#d29922; --strip:#39c5cf; --hash:#79c0ff;
    --r:10px; font-synthesis:none;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg)}
  body{
    color:var(--ink);
    font-family:"Nimbus Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:13px;line-height:1.4;min-height:100%;
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"DejaVu Sans Mono","SFMono-Regular",Menlo,Consolas,monospace}

  /* ---------- top bar ---------- */
  header{
    display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;flex:0 0 auto;
    background:linear-gradient(180deg,#0e141c,#0b1017);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
  .brand .word{font-size:20px;font-weight:800;letter-spacing:.10em}
  .brand .word i{color:var(--acc);font-style:normal}
  .brand .tag{font-size:11px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
  .spacer{flex:1}
  .hstat{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);
         letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(63,185,80,.14)}
  .dot.demo{background:var(--hum);box-shadow:0 0 0 3px rgba(210,153,34,.16)}
  .dot.dead{background:var(--deny);box-shadow:0 0 0 3px rgba(248,81,73,.16)}
  .clock{font-variant-numeric:tabular-nums;color:var(--ink);font-size:13px;letter-spacing:.04em}

  /* ---------- layout ---------- */
  main{flex:1 1 auto;display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:0;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .col.list{border-right:1px solid var(--line);background:var(--panel2)}
  .col.story{background:var(--bg);overflow:auto}
  .panelhead{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line2);
    font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#b9c5d2;flex:0 0 auto;
    background:#0c1119}
  .panelhead .c{margin-left:auto;font-size:11px;letter-spacing:.05em;color:var(--mut);
    font-weight:600;text-transform:none}
  .panelhead .c b{color:var(--ink)}

  /* ---------- Screen 1: activity list ---------- */
  .events{flex:1 1 auto;min-height:0;overflow:auto}
  .ev{display:block;width:100%;text-align:left;border:none;background:transparent;color:inherit;
      font-family:inherit;cursor:pointer;padding:12px 16px;border-bottom:1px solid #12181f;
      border-left:3px solid transparent}
  .ev:hover{background:#0e141d}
  .ev.on{background:#0e1620;border-left-color:var(--acc)}
  .ev .l1{display:flex;align-items:center;gap:8px}
  .ev .who{font-weight:700;font-size:13px}
  .ev .when{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .ev .l2{margin-top:3px;font-size:12.5px;color:#c9d6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .l3{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
  .ev .state{font-size:11px;color:var(--mut)}
  .ev .state b{color:var(--ink)}

  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
        padding:2px 8px;border-radius:20px;border:1px solid;text-transform:uppercase;white-space:nowrap}
  .p-allow{color:var(--ok);border-color:rgba(63,185,80,.45);background:rgba(63,185,80,.08)}
  .p-deny{color:var(--deny);border-color:rgba(248,81,73,.5);background:rgba(248,81,73,.09)}
  .p-human{color:var(--hum);border-color:rgba(210,153,34,.5);background:rgba(210,153,34,.1)}
  .p-revoked{color:var(--deny);border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.06)}
  .p-redact{color:var(--strip);border-color:rgba(57,197,207,.45);background:rgba(57,197,207,.08)}
  .p-none{color:var(--dim);border-color:#2a333f;background:#0d131b}
  .tag{display:inline-block;font-size:10.5px;color:var(--mut);border:1px solid var(--line);
       border-radius:5px;padding:1px 7px}
  .tag.stop{color:var(--deny);border-color:rgba(248,81,73,.4)}
  .tag.left{color:var(--acc);border-color:rgba(240,136,62,.45)}
  .tag.held{color:var(--hum);border-color:rgba(210,153,34,.45)}

  /* ---------- Screen 2..4: the story ---------- */
  .storywrap{padding:20px 24px 40px;max-width:900px}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700}
  h1.verdict{font-size:27px;font-weight:800;letter-spacing:.01em;margin:8px 0 4px;line-height:1.15}
  h1.verdict.deny{color:var(--deny)} h1.verdict.allow{color:var(--ok)}
  h1.verdict.human{color:var(--hum)} h1.verdict.revoked{color:var(--deny)}
  .subline{color:var(--mut);font-size:13.5px;margin-bottom:16px}
  .subline b{color:var(--ink)}

  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
  .cell .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .cell .v{margin-top:5px;font-size:14px;color:var(--ink);word-break:break-word}
  .cell .v.big{font-size:16px;font-weight:700}
  .cell .note{margin-top:5px;font-size:11.5px;color:var(--mut)}
  .cell.warn{border-color:rgba(248,81,73,.4)}
  .cell.hold{border-color:rgba(210,153,34,.4)}
  .cell.good{border-color:rgba(63,185,80,.35)}
  .cell .v .mono{font-size:12.5px;color:var(--hash)}
  .cell .v .no{color:var(--deny);font-weight:700}
  .cell .v .yes{color:var(--ok);font-weight:700}

  /* the causal chain */
  .chain{margin:16px 0 6px;border-left:2px solid var(--line)}
  .step{position:relative;padding:8px 0 8px 22px}
  .step:before{content:"";position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:50%;
    background:var(--panel);border:2px solid var(--dim)}
  .step.done:before{border-color:var(--ok);background:var(--ok)}
  .step.authority:before{border-color:var(--acc);background:var(--acc);box-shadow:0 0 0 4px rgba(240,136,62,.16)}
  .step.miss:before{border-color:var(--deny);background:var(--bg)}
  .step .st{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .step .sd{margin-top:2px;font-size:13px;color:#c9d6e4}
  .step .si{margin-top:2px;font-size:12.5px;color:var(--hash)}
  .step .si .n{color:var(--dim)}
  .step.authority .st{color:var(--acc)}
  .authorityline{margin:14px 0 0;padding:11px 14px;border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:8px;background:var(--panel2);font-size:13px;color:#d7e2ee}
  .authorityline b{color:var(--acc)}

  /* actions */
  .acts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
  button.btn{font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    cursor:pointer}
  button.btn:hover{border-color:var(--mut)}
  button.btn.primary{background:var(--acc);border-color:var(--acc);color:#120b04}
  button.btn.go{background:linear-gradient(180deg,#3fb950,#2e8c3c);border-color:#2e8c3c;color:#04120a}
  button.btn.stop{background:linear-gradient(180deg,#e2413a,#b3261f);border-color:#b3261f;color:#fff}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  .actnote{font-size:11.5px;color:var(--mut);margin-top:8px;min-height:16px}
  .actnote b{color:var(--ink)} .actnote .bad{color:var(--deny)} .actnote .good{color:var(--ok)}

  /* technical details */
  details.tech{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2)}
  details.tech>summary{cursor:pointer;padding:11px 16px;font-size:11.5px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--mut);list-style:none}
  details.tech>summary::-webkit-details-marker{display:none}
  details.tech>summary:before{content:"▸ ";color:var(--dim)}
  details.tech[open]>summary:before{content:"▾ "}
  details.tech .body{padding:4px 16px 16px;border-top:1px solid var(--line2)}
  .kv{display:grid;grid-template-columns:210px 1fr;gap:3px 14px;font-size:12.5px;padding:6px 0}
  .kv .k{color:var(--dim)}
  .kv .v{color:#c9d6e4;word-break:break-all}
  .kv .v .mono{color:var(--hash);font-size:12px}
  .tech h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
    margin:14px 0 4px;font-weight:700}
  .tech p.note{font-size:12px;color:var(--mut);margin:6px 0}
  .toolist{font-size:12px;color:#c9d6e4;line-height:1.7}
  .toolist .row{display:grid;grid-template-columns:1fr 90px;gap:10px;padding:3px 0;border-bottom:1px solid #12181f}

  /* empty + loading */
  .empty{padding:40px 24px;color:var(--mut);font-size:13px;text-align:center}
  .empty b{color:var(--ink)}
  .hidden{display:none !important}

  /* footer */
  footer{flex:0 0 auto;display:flex;align-items:center;gap:26px;padding:0 20px;height:34px;
    background:#0b1017;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
  footer .k b{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
  footer .r{margin-left:auto;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
  @media (max-width:900px){ main{grid-template-columns:1fr} .col.list{max-height:40vh} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="word">TEN<i>E</i>T</span>
    <span class="tag">AI Control Layer</span>
  </div>
  <div class="spacer"></div>
  <div class="hstat"><span id="srcDot" class="dot demo"></span><span id="srcTxt">connecting…</span></div>
  <div class="clock mono" id="clock">--:--:--</div>
</header>

<main>
  <section class="col list" aria-label="AI agent activity">
    <div class="panelhead">
      AI AGENT ACTIVITY
      <span class="c"><b id="evCount">0</b> events</span>
    </div>
    <div class="events" id="events"></div>
  </section>

  <section class="col story" aria-label="Decision story">
    <div id="story" class="storywrap"><div class="empty">Waiting for the control plane…</div></div>
  </section>
</main>

<footer>
  <span class="k">authority <b>kernel</b></span>
  <span class="k">events <b id="fEvents">0</b></span>
  <span class="k">blocked <b id="fBlocked">0</b></span>
  <span class="k">left the boundary <b id="fCrossed">0</b></span>
  <span class="r" id="footMode">—</span>
</footer>
<script>
"use strict";
/* TENET Control Room - story first.
 *
 * SCREEN 1  AI AGENT ACTIVITY : every action the kernel holds, what the agent wanted, how it ended.
 * SCREEN 2  WHY              : WHO / WHAT / DATA / AUTHORITY / POLICY / DECISION / WHY.
 * SCREEN 3  WHAT HAPPENED    : the real causal chain run -> model trace -> action -> decision -> call -> receipt.
 * SCREEN 4  PROOF            : the ids, kept apart, with the authority line.
 *
 * Every line comes from GET /api/security-events (a read-only kernel projection). Nothing here
 * decides, nothing is invented: on an unknown field the page prints an em dash. The model trace
 * is evidence, never a permission. Authority lives in the kernel decision.
 */
const $ = id => document.getElementById(id);
const esc = s => (s===null||s===undefined) ? "" : String(s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
/* The honest empty value: an absent field is a dash, never a friendly default. */
const dash = v => (v===null||v===undefined||v==="") ? "—" : v;
const kv = (k,v,cls) => '<div class="'+cls+'"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>';
const mono = v => v===null||v===undefined||v==='' ? '<span class="n">—</span>'
  : '<span class="mono">'+esc(v)+'</span>';

const S = { events:[], byRun:{}, agents:[], warrants:[], selected:null, mode:"", view:"activity", token:"" };
const DECISION_LABEL = {allow:"allowed", deny:"blocked", human:"waiting for a human", revoked:"revoked", redact:"redacted"};
const DECISION_PILL  = {allow:"p-allow", deny:"p-deny", human:"p-human", revoked:"p-revoked", redact:"p-redact"};

function fmtTime(ts){
  if(!ts) return "—";
  const d = new Date(ts*1000);
  return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
}
/* The one-line reading of what an agent is doing, in the operator's language. The kernel
   projects an ``intent`` when the arguments describe one; when it does not, we fall back to the
   resource name - never to a fabricated sentence. */
function wantPhrase(e){
  if(e.intent) return e.intent;
  if(e.tool) return e.tool;
  return "an action";
}
function decisionOf(e){
  if(e.decision) return e.decision;
  if(e.state === "pending") return "human";
  return "";
}
/* With a decision in hand, the kernel's ``state`` says what became of it. An ``expired`` hold is
   NOT still waiting: it is a record of a hold nobody ever decided. Saying "waiting for a human"
   there would be a lie about a live order. */
function stateNote(e){
  const d = decisionOf(e);
  if(d === "human"){
    if(e.state === "expired") return {label:"expired, never decided", tone:"expired"};
    if(e.state === "denied")  return {label:"denied by a person", tone:"deny"};
    if(e.state === "approved")return {label:"approved by a person", tone:"allow"};
    return {label:"waiting for a person now", tone:"human"};
  }
  if(e.state === "revoked") return {label:"revoked", tone:"revoked"};
  return null;
}
/* Did anything actually leave the boundary? A decision alone never proves a crossing:
   ``upstream_contacted`` is the evidence-backed answer, and when it is absent the page says
   "not recorded" rather than "no". A held action a person later approved DOES cross, so
   ``upstream_contacted`` is checked first, ahead of the decision label. */
function boundaryState(e){
  if(e.upstream_contacted === true) return {cls:"left", txt:"LEFT THE BOUNDARY"};
  if(e.decision === "allow" || e.decision === "redact")
    return {cls:"stop", txt:"NO CALL RECORDED"};
  if(e.state === "expired") return {cls:"held", txt:"HELD, THEN EXPIRED"};
  if(decisionOf(e) === "human") return {cls:"held", txt:"HELD AT THE BOUNDARY"};
  return {cls:"stop", txt:"NEVER LEFT"};
}

/* ---------- Screen 1: the activity list ---------- */
function renderList(){
  const box = $("events");
  if(!S.events.length){
    box.innerHTML = '<div class="empty">No agent activity recorded yet.<br>'
      + '<b>Run an agent</b> through the control plane and it will appear here — '
      + 'with the kernel\'s verdict and whether anything left the boundary.</div>';
    return;
  }
  box.innerHTML = S.events.map((e,i)=>{
    const d = decisionOf(e);
    const st = stateNote(e);
    const b = boundaryState(e);
    const sel = (S.selected && S.selected.run_id === e.run_id) ? " on" : "";
    return '<button class="ev'+sel+'" data-i="'+i+'" aria-label="Open the story for run '+esc(e.run_id)+'">'
      + '<div class="l1"><span class="who">'+esc(dash(e.agent))+'</span>'
        + '<span class="pill '+(DECISION_PILL[d]||"p-none")+'">'+esc(DECISION_LABEL[d]||dash(d))+'</span>'
        + '<span class="when mono">'+esc(fmtTime(e.timestamp))+'</span></div>'
      + '<div class="l2">wants to '+esc(wantPhrase(e))+'</div>'
      + '<div class="l3"><span class="tag '+b.cls+'">'+b.txt+'</span>'
        + (st ? '<span class="tag '+(st.tone==="expired"?"held":st.tone)+'">'+esc(st.label)+'</span>' : '')
        + '<span class="state">class <b>'+esc(dash(e.action_class))+'</b></span>'
        + '<span class="state">action <b class="mono">'+esc(dash(e.event_id))+'</b></span></div>'
      + '</button>';
  }).join("");
  [...box.querySelectorAll(".ev")].forEach(el=>{
    el.addEventListener("click", ()=>selectEvent(S.events[+el.dataset.i]));
  });
}

/* ---------- Screen 2/3/4: WHY + WHAT HAPPENED + PROOF, one event at a time ---------- */
function storyForEvent(e){
  const d = decisionOf(e);
  const st = stateNote(e);
  const expired = st && st.tone === "expired";
  const heading = expired ? "Held for a person — the hold expired"
    : {deny:"Blocked before execution",
       allow:"Allowed — the call left the boundary",
       human:"Waiting for human approval",
       revoked:"Revoked — the order was pulled",
       redact:"Redacted before the data left"}[d] || "Decision recorded";
  const sub = expired
    ? "The kernel held this at the boundary and no person ever decided it. Nothing left; the order lapsed."
    : {deny:"The request stopped before data left the boundary.",
       allow:"The kernel permitted the call; the upstream answered.",
       human:"Held at the boundary. Nothing has left; a person must decide.",
       revoked:"The warrant under this action was pulled, so the chain stopped.",
       redact:"Permitted only after the sensitive fields were stripped."}[d] || "";
  return renderStory(e, heading, sub);
}

/* The WHY grid: WHO / WHAT / DATA / AUTHORITY / POLICY / DECISION / WHY - plain language first,
   every technical field expanded below. Nothing here is generated from a template of facts we
   do not hold: an absent value is a dash. */
function whyGrid(e){
  const d = decisionOf(e);
  const who = esc(dash(e.actor || e.agent));
  const what = esc(wantPhrase(e));
  const data = e.tool ? esc(e.tool) : "—";
  const auth = e.warrant ? ('order <span class="mono">'+esc(e.warrant)+'</span>'
      + (e.warrant_state ? ' · '+esc(e.warrant_state) : ''))
    : '<span class="n">no order on the record</span>';
  const policy = esc(dash(e.policy));
  const dec = '<span class="'+(d==="allow"?"yes":d==="deny"?"no":"")+'">'
    + esc(DECISION_LABEL[d]||dash(d))+'</span>';
  const why = esc(dash(e.reason));
  return '<div class="grid2">'
    + kv("WHO is acting", who, "cell")
    + kv("WHAT it wants", what, "cell")
    + kv("DATA / resource", data, "cell")
    + kv("AUTHORITY (the order)", auth, "cell")
    + kv("POLICY that was applied", policy, "cell")
    + kv("DECISION", dec, "cell" + (d==="deny"?" warn":d==="human"?" hold":d==="allow"?" good":""))
    + '</div>'
    + '<div class="grid2" style="grid-template-columns:1fr">'
    + kv("WHY — in the kernel's own words", why, "cell"+(d==="deny"?" warn":"") )
    + '</div>';
}

/* SCREEN 3 - WHAT HAPPENED. The chain is built from the graph the kernel hands back, so a step
   appears only when there is an id behind it. A step the kernel could not fill is drawn as
   "missing" with the name the kernel itself used, not skipped: an incomplete chain is itself
   the finding. */
function chain(e){
  const g = e.causal_graph || {};
  const nodes = g.nodes || [];
  /* The kernel names a missing field in ``missing`` (e.g. "model_trace_id"); several actions
     can contribute the same step, so we index by step and keep the first with an id. */
  const missingNames = e.missing || [];
  const byStep = {};
  nodes.forEach(n => { if(n && n.step && !(byStep[n.step] && byStep[n.step].id)) byStep[n.step] = n; });
  const ORDER = [
    ["run_id", "1 · the agent run", "the run this all belongs to", "done"],
    ["model_trace_id", "2 · the model behind the decision", "the request reached the model", ""],
    ["action_id", "3 · the action the kernel holds", esc(wantPhrase(e)), "authority"],
    ["decision", "4 · the kernel decision", esc(dash(e.reason)), "authority"],
    ["upstream_call_id", "5 · the upstream call",
      e.upstream_contacted===true ? "a real contact left the boundary"
        : "<span class='n'>no contact recorded — nothing left the boundary</span>", ""],
    ["receipt_id", "6 · the receipt (the proof)", "the recorded outcome", ""]
  ];
  const steps = ORDER.map(([step, title, sd, cls])=>{
    const n = byStep[step];
    const isMissing = !(n && n.id);
    if(isMissing && missingNames.indexOf(step) < 0 && step !== "upstream_call_id"){
      /* A step with neither a node nor a named absence is simply not part of this run. */
      return "";
    }
    return '<div class="step '+(isMissing ? "miss" : "done")+(cls?" "+cls:"")+'">'
      + '<div class="st">'+esc(title)+'</div>'
      + '<div class="sd">'+sd+'</div>'
      + '<div class="si">'+(isMissing ? '<span class="n">missing</span>'
                                     : mono(n.id))+'</div>'
      + '</div>';
  }).join("");
  return '<div class="chain">'+steps+'</div>';
}

/* The model evidence is flat on a feed event and nested under ``model`` on a single-run read.
   One accessor so both shapes read identically. */
function modelOf(e){
  if(e && e.model && typeof e.model === "object") return e.model;
  const m = {};
  ["model_trace_id","model_requested","model_served","provider_status","provider_ok",
   "provider_reached","model_calls_started","model_calls_completed","latency_ms","tokens"]
    .forEach(k => { m[k] = e ? e[k] : undefined; });
  return m;
}

/* SCREEN 4 - PROOF. The ids are never collapsed into one "trace id", because they prove
   different things and only one of them is the authority. The authority line closes the story:
   the verdict came from the kernel, and it was reached before the call ran. */
function proof(e){
  const m = modelOf(e);
  const traceNote = (m.model_trace_id)
    ? (m.provider_ok ? "the model answered (HTTP "+esc(m.provider_status)+")"
                     : "<span class='no'>the provider answered HTTP "+esc(dash(m.provider_status))
                       +"</span> — the trace is real, the reasoning was not")
    : "no trace id the provider confirmed";
  const ids = [
    ["RUN", e.run_id, "the agent run this belongs to"],
    ["ACTION", e.event_id, "the unit of enforcement in the kernel's ledger"],
    ["RECEIPT", e.receipt_id, "the kernel's record of the decision"],
    ["MODEL TRACE", m.model_trace_id, traceNote],
    ["UPSTREAM CALL", e.upstream_call_id, "a real contact's id — not recorded in this slice"]
  ];
  return '<details class="tech" open><summary>PROOF — the ids, kept apart</summary><div class="body">'
    + '<div class="kv">'
    + ids.map(p => '<div class="k">'+esc(p[0])+'</div><div class="v">'+mono(p[1])
        + ' <span class="n">'+esc(p[2])+'</span></div>').join("")
    + '</div>'
    + '<div class="authorityline"><b>Authority</b> — the verdict came from the kernel, not from the '
    + 'model. The model trace above is evidence that a request was made; it is never a permission. '
    + 'This page is read-only: it cannot approve, deny or revoke. Decisions are made in the kernel '
    + 'and recorded there.</div>'
    + '</div></details>';
}

/* The technical drawer: the raw projection, so an auditor can check the story against the record. */
function techDrawer(e){
  const m = modelOf(e);
  const fields = [
    ["agent", e.agent], ["actor", e.actor], ["tool", e.tool], ["action_class", e.action_class],
    ["intent", e.intent], ["resource", e.resource], ["decision", e.decision], ["state", e.state],
    ["policy", e.policy], ["reason", e.reason], ["warrant", e.warrant],
    ["warrant_state", e.warrant_state],
    ["upstream_contacted", e.upstream_contacted], ["boundary_attempts", e.boundary_attempts],
    ["timestamp", e.timestamp],
    ["model_requested", m.model_requested], ["model_served", m.model_served],
    ["model_calls_started", m.model_calls_started], ["model_calls_completed", m.model_calls_completed],
    ["provider_reached", m.provider_reached], ["provider_status", m.provider_status],
    ["provider_ok", m.provider_ok], ["latency_ms", m.latency_ms]
  ];
  let rows = fields.map(f => '<div class="k">'+esc(f[0])+'</div><div class="v">'
      + ((f[1]===null||f[1]===undefined||f[1]==="") ? '<span class="n">—</span>' : esc(f[1]))
      + '</div>').join("");
  const missing = (e.missing&&e.missing.length)
    ? '<h4>reported missing by the kernel</h4><p class="note">'+esc(e.missing.join(", "))+'</p>' : "";
  return '<details class="tech"><summary>TECHNICAL DETAIL — the projection behind the story</summary>'
    + '<div class="body"><div class="kv">'+rows+'</div>'+missing
    + '<p class="note">Source: <span class="mono">GET /api/security-events/'+esc(e.run_id)+'</span> '
    + '(read-only kernel projection). An em dash means the kernel holds no value for that field.</p>'
    + '</div></details>';
}

/* The actions. The page does not decide - it calls the control plane, which calls the kernel.
   A human approval is a real, recorded event: after approving, the run is re-read and the story
   shows what the kernel now says. */
function actionsFor(e){
  const d = decisionOf(e);
  const st = stateNote(e);
  const expired = st && st.tone === "expired";
  const waiting = !expired && (d === "human" || e.state === "pending");
  if(waiting){
    return '<div class="acts">'
      + '<button class="btn go" id="btnApprove">Approve once</button>'
      + '<button class="btn stop" id="btnDeny">Deny</button>'
      + '<button class="btn" id="btnRevoke">Revoke the order</button>'
      + '</div><div class="actnote" id="actnote">A human decision here is recorded as an event '
      + 'by the kernel — it is the authority, this page is the hand.</div>';
  }
  if(expired){
    return '<div class="acts"><button class="btn" id="btnRevoke">Revoke the order</button></div>'
      + '<div class="actnote" id="actnote">This hold already lapsed — the kernel will refuse an '
      + 'approval, and that refusal is itself recorded. Revoking clamps the authority down.</div>';
  }
  if(d === "allow"){
    return '<div class="acts"><button class="btn stop" id="btnRevoke">Revoke the order</button></div>'
      + '<div class="actnote" id="actnote">This call already ran. Revoking stops the <b>next</b> '
      + 'agent ordered under this authority — the past cannot be pulled back.</div>';
  }
  return '<div class="acts"><button class="btn primary" id="btnRevoke">Revoke the order</button></div>'
    + '<div class="actnote" id="actnote">The kernel already blocked this. Revoking the order '
    + 'closes the authority so nothing else rides on it.</div>';
}

function renderStory(e, heading, sub){
  const d = decisionOf(e);
  const cls = (d==="allow")?"allow":(d==="human")?"human":(d==="revoked")?"revoked":"deny";
  const html =
      '<div id="storyInner">'
    + '<div class="eyebrow">AI AGENT ACTIVITY · WHY THIS HAPPENED</div>'
    + '<h1 class="verdict '+cls+'">'+esc(heading)+'</h1>'
    + '<div class="subline">'+esc(sub)+'</div>'
    + whyGrid(e)
    + '<div class="eyebrow" style="margin-top:22px">WHAT HAPPENED — the chain, in order</div>'
    + chain(e)
    + '<div class="eyebrow" style="margin-top:22px">PROOF</div>'
    + proof(e)
    + actionsFor(e)
    + techDrawer(e)
    + '</div>';
  $("story").innerHTML = html;
  wireActions(e);
}
function wireActions(e){
  const ap = $("btnApprove"), dn = $("btnDeny"), rv = $("btnRevoke");
  if(ap) ap.addEventListener("click", ()=>decide(e, "approve"));
  if(dn) dn.addEventListener("click", ()=>decide(e, "deny"));
  if(rv) rv.addEventListener("click", ()=>revoke(e));
}
function actNote(msg, kind){
  const n = $("actnote");
  if(n) n.innerHTML = kind ? '<span class="'+kind+'">'+msg+'</span>' : msg;
}

/* The operator token is read from localStorage under the product name; the legacy key is still
   honoured so an existing operator is not locked out by the rename. */
function operatorToken(){
  try{
    return localStorage.getItem("tenet_operator") || localStorage.getItem("warrnt_admin") || "";
  }catch(e){ return ""; }
}
async function post(path, body){
  const h = {"Content-Type":"application/json"};
  const t = operatorToken();
  if(t) h["X-Operator-Token"] = t;
  const r = await fetch(path, {method:"POST", headers:h, body:JSON.stringify(body||{})});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && (j.detail||j.error)) || ("HTTP "+r.status));
  return j;
}
async function decide(e, verb){
  actNote("Asking the control plane to "+verb+"…");
  try{
    const res = await post("/api/actions/"+encodeURIComponent(e.event_id)+"/"+verb);
    actNote("Kernel recorded: <b>"+esc((res&&(res.decision||res.state))||verb)+"</b>. Re-reading the record…", "good");
    await refresh(true);
  }catch(err){
    actNote("The control plane refused: "+esc(err.message), "bad");
  }
}
async function revoke(e){
  const agent = e.agent;
  if(!agent){ actNote("This event names no agent, so there is no order to revoke.", "bad"); return; }
  actNote("Pulling the order under <b>"+esc(agent)+"</b>…");
  try{
    const res = await post("/api/agents/"+encodeURIComponent(agent)+"/revoke");
    actNote("Order revoked by the kernel: <b>"+esc((res&&res.state)||"revoked")+"</b>.", "good");
    await refresh(true);
  }catch(err){
    actNote("The control plane refused: "+esc(err.message), "bad");
  }
}

/* ---------- selection + bootstrap ---------- */
function selectEvent(e){
  S.selected = e;
  renderList();
  if(e && e.run_id) loadStory(e.run_id);
  else $("story").innerHTML = '<div class="empty">This event carries no run id, '
    + 'so the kernel can offer no chain for it.</div>';
}
async function loadStory(runId){
  try{
    const r = await fetch("/api/security-events/"+encodeURIComponent(runId));
    if(r.status === 404){ storyForEvent(S.selected); return; }
    const e = await r.json();
    S.selected = e; renderList(); storyForEvent(e);
  }catch(e){ if(S.selected) storyForEvent(S.selected); }
}
function setSource(state, txt){
  const d = $("srcDot"); d.classList.remove("demo","dead");
  if(state) d.classList.add(state);
  $("srcTxt").textContent = txt;
}
function head(){
  const n = S.events.length;
  const blocked = S.events.filter(e => decisionOf(e)==="deny").length;
  const crossed = S.events.filter(e => e.upstream_contacted===true).length;
  $("evCount").textContent = n;
  $("fEvents").textContent = n;
  $("fBlocked").textContent = blocked;
  $("fCrossed").textContent = crossed;
}
async function refresh(keep){
  let feed;
  try{
    const r = await fetch("/api/security-events?limit=100");
    if(!r.ok) throw new Error("HTTP "+r.status);
    feed = await r.json();
  }catch(err){
    setSource("dead","control plane unreachable");
    $("story").innerHTML = '<div class="empty"><b>The control plane is unreachable.</b><br>'
      + 'Start it with <span class="mono">scripts/serve_tenet.sh</span> and this page will fill in.<br>'
      + '<span class="n">'+esc(err.message)+'</span></div>';
    return;
  }
  S.events = (feed.events||feed||[]);
  setSource("", "control plane live");
  head(); renderList();
  if(!S.events.length){
    $("story").innerHTML = '<div class="empty">No agent activity yet.<br>'
      + '<b>Run an agent</b> through the control plane and its story will appear here.</div>';
    return;
  }
  const want = keep && S.selected
    ? (S.events.find(x => x.run_id===S.selected.run_id) || S.events[0])
    : S.events[0];
  S.selected = want; renderList(); await loadStory(want.run_id);
}
function tick(){ $("clock").textContent = new Date().toLocaleTimeString(); }
async function boot(){
  try{
    const r = await fetch("/api/overview");
    if(r.ok){ const o = await r.json();
      S.mode = (o.mode||o.source||"");
      $("footMode").textContent = S.mode ? ("mode "+S.mode) : "mode —";
    }
  }catch(e){}
  tick(); setInterval(tick, 1000);
  await refresh(false); setInterval(()=>refresh(true), 5000);
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
